<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Finta Károly</title>
  </head>
  <body>
    <main>
      <header><h1>SZÁMOLÓGÉP</h1></header>
      <article>
        <div class="eredmeny"></div>
        <div class="gombok">
          <div class="sorok" id="elsosor">
            <button class="gomb">7</button>
            <button class="gomb">8</button>
            <button class="gomb">9</button>
            <button class="gomb">/</button>
          </div>
          <div class="sorok" id="masodiksor">
            <button class="gomb">4</button>
            <button class="gomb">5</button>
            <button class="gomb">6</button>
            <button class="gomb">*</button>
          </div>
          <div class="sorok" id="harmadiksor">
            <button class="gomb">1</button>
            <button class="gomb">2</button>
            <button class="gomb">3</button>
            <button class="gomb">-</button>
          </div>
          <div class="sorok" id="negyediksor">
            <button class="gomb" id="clear">c</button>
            <button class="gomb">0</button>
            <button class="gomb">=</button>
            <button class="gomb">+</button>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
